<!DOCTYPE html>
<html>
<head>
  <title>Embedded Payments Demo</title>
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1 id="auth-title">Welcome back</h1>
      <p class="auth-subtitle" id="auth-subtitle">Log in to manage your invoices</p>

      <form id="auth-form">
        <label>Email</label>
        <input id="auth-email" class="text-input" type="email" autocomplete="email" required />

        <label>Password</label>
        <input id="auth-password" class="text-input" type="password" autocomplete="current-password" required />

        <div id="auth-error" class="auth-error"></div>

        <button id="auth-submit" type="submit" style="width: 100%;">Log In</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Don't have an account?</span>
        <a id="auth-switch-link" href="#">Sign up</a>
      </p>
    </div>
  </div>

  <!-- ============ APP SCREEN ============ -->
  <div id="app-screen" style="display: none;">
    <div class="header">
      <h1>Invoices</h1>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </div>

    <button id="add-invoice-btn" style="margin-bottom: 16px;">+ Add Invoice</button>

    <div id="invoices" class="loading">Loading...</div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal-overlay">
      <div class="modal-box">
        <div id="payment-form">
          <h2 style="margin-top:0;">Enter Card Details</h2>

          <label>Card Number</label>
          <div id="card-number" class="stripe-input"></div>

          <div style="display: flex; gap: 8px;">
            <div style="flex: 1;">
              <label>Expiry</label>
              <div id="card-expiry" class="stripe-input"></div>
            </div>
            <div style="flex: 1;">
              <label>CVC</label>
              <div id="card-cvc" class="stripe-input"></div>
            </div>
          </div>

          <label>ZIP Code</label>
          <div id="postal-code" class="stripe-input"></div>

          <div id="card-errors" class="form-error"></div>

          <button id="submit-payment" style="width: 100%;">Pay Now</button>
          <button id="cancel-payment" class="btn-secondary" style="width: 100%; margin-top: 8px;">Cancel</button>
        </div>

        <div id="payment-success" style="display: none; text-align: center; padding: 20px 0;">
          <div style="font-size: 48px; color: green; margin-bottom: 10px;">✓</div>
          <h2 style="color: green; margin: 0;">Payment Successful!</h2>
          <p style="color: #666;">Your invoice has been paid.</p>
        </div>
      </div>
    </div>

    <!-- Create Invoice Modal -->
    <div id="create-modal" class="modal-overlay">
      <div class="modal-box">
        <h2 style="margin-top:0;">New Invoice</h2>

        <label>Customer Name</label>
        <input id="new-customer" class="text-input" type="text" placeholder="e.g. Acme Supplies" />

        <label>Amount (USD)</label>
        <input id="new-amount" class="text-input" type="number" inputmode="decimal" placeholder="e.g. 500" min="1" />

        <div id="create-error" class="form-error"></div>

        <button id="submit-invoice" style="width: 100%;">Create Invoice</button>
        <button id="cancel-invoice" class="btn-secondary" style="width: 100%; margin-top: 8px;">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Scripts: order matters -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Embedded Payments Demo</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; }
    .invoice { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; align-items: center; }
    button { padding: 8px 16px; cursor: pointer; background: #635bff; color: white; border: none; border-radius: 4px; font-size: 14px; }
    button:hover { background: #544bc7; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .paid { color: green; font-weight: bold; }
    .loading { color: #888; }

    .stripe-input { border: 1px solid #ccc; padding: 10px; border-radius: 4px; margin-bottom: 12px; background: white; width: 100%; box-sizing: border-box; font-size: 14px; }
    .stripe-input.StripeElement--focus { border-color: #635bff; }
    .stripe-input.StripeElement--invalid { border-color: red; }

    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }

    .invoice.sample { opacity: 0.5; }
    .invoice.sample button { pointer-events: none; }
    .badge {
      display: inline-block;
      background: #f0f0f0;
      color: #666;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: bold;
      letter-spacing: 0.5px;
      vertical-align: middle;
    }
    .sample-hint {
      font-size: 13px;
      color: #888;
      text-align: center;
      margin-top: 16px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Invoices</h1>
    <button id="add-invoice-btn">+ Add Invoice</button>
  </div>

  <div id="invoices" class="loading">Loading...</div>

  <!-- Payment Modal -->
  <div id="payment-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: white; padding: 24px; border-radius: 8px; width: 400px; max-width: 90%;">

      <div id="payment-form">
        <h2 style="margin-top:0;">Enter Card Details</h2>

        <label>Card Number</label>
        <div id="card-number" class="stripe-input"></div>

        <div style="display: flex; gap: 8px;">
          <div style="flex: 1;">
            <label>Expiry</label>
            <div id="card-expiry" class="stripe-input"></div>
          </div>
          <div style="flex: 1;">
            <label>CVC</label>
            <div id="card-cvc" class="stripe-input"></div>
          </div>
        </div>

        <label>ZIP Code</label>
        <div id="postal-code" class="stripe-input"></div>

        <div id="card-errors" style="color: red; font-size: 14px; margin-bottom: 16px;"></div>

        <button id="submit-payment" style="width: 100%;">Pay Now</button>
        <button id="cancel-payment" style="background: #eee; color: #333; width: 100%; margin-top: 8px;">Cancel</button>
      </div>

      <div id="payment-success" style="display: none; text-align: center; padding: 20px 0;">
        <div style="font-size: 48px; color: green; margin-bottom: 10px;">✓</div>
        <h2 style="color: green; margin: 0;">Payment Successful!</h2>
        <p style="color: #666;">Your invoice has been paid.</p>
      </div>

    </div>
  </div>

  <!-- Create Invoice Modal -->
  <div id="create-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: white; padding: 24px; border-radius: 8px; width: 400px; max-width: 90%;">
      <h2 style="margin-top:0;">New Invoice</h2>

      <label>Customer Name</label>
      <input id="new-customer" class="stripe-input" type="text" placeholder="e.g. Acme Supplies" />

      <label>Amount (USD)</label>
      <input id="new-amount" class="stripe-input" type="number" inputmode="decimal" placeholder="e.g. 500" min="1" />

      <div id="create-error" style="color: red; font-size: 14px; margin-bottom: 16px;"></div>

      <button id="submit-invoice" style="width: 100%;">Create Invoice</button>
      <button id="cancel-invoice" style="background: #eee; color: #333; width: 100%; margin-top: 8px;">Cancel</button>
    </div>
  </div>

  <script>
    let stripe;
    let cardNumber, cardExpiry, cardCvc, postalCode;

    let currentInvoiceId = null;
    let currentIdempotencyKey = null;

    async function initStripe() {
      const res = await fetch('/config');
      const { publishableKey } = await res.json();

      stripe = Stripe(publishableKey);
      const elements = stripe.elements();

      cardNumber = elements.create('cardNumber');
      cardExpiry = elements.create('cardExpiry');
      cardCvc = elements.create('cardCvc');
      postalCode = elements.create('postalCode');

      cardNumber.mount('#card-number');
      cardExpiry.mount('#card-expiry');
      cardCvc.mount('#card-cvc');
      postalCode.mount('#postal-code');
    }

    async function loadInvoices() {
      const res = await fetch('/invoices');
      const invoices = await res.json();
      const container = document.getElementById('invoices');
      container.classList.remove('loading');
      container.innerHTML = '';

      if (invoices.length === 0) {
        renderSampleInvoice(container);
        return;
      }

      invoices.forEach((inv) => {
        const div = document.createElement('div');
        div.className = 'invoice';

        const label = document.createElement('span');
        label.textContent = `${inv.customer} — $${(inv.amount / 1).toFixed(2)}`;
        div.appendChild(label);

        if (inv.paid) {
          const paid = document.createElement('span');
          paid.className = 'paid';
          paid.textContent = 'Paid';
          div.appendChild(paid);
        } else {
          const btn = document.createElement('button');
          btn.textContent = 'Pay';
          btn.onclick = () => openPaymentModal(inv.id);
          div.appendChild(btn);
        }
        container.appendChild(div);
      });
    }

    function renderSampleInvoice(container) {
      const div = document.createElement('div');
      div.className = 'invoice sample';

      const label = document.createElement('span');
      label.innerHTML = 'Sample Supplies Co. — $1,500.00 <span class="badge">SAMPLE</span>';
      div.appendChild(label);

      const btn = document.createElement('button');
      btn.textContent = 'Pay';
      btn.disabled = true;
      div.appendChild(btn);

      container.appendChild(div);

      const hint = document.createElement('p');
      hint.className = 'sample-hint';
      hint.textContent = 'This is what an invoice looks like. Click "+ Add Invoice" to create your own.';
      container.appendChild(hint);
    }

    function openPaymentModal(invoiceId) {
      currentInvoiceId = invoiceId;

      const storageKey = `idempotency_key_${invoiceId}`;
      let storedKey = sessionStorage.getItem(storageKey);

      if (!storedKey) {
        storedKey = crypto.randomUUID();
        sessionStorage.setItem(storageKey, storedKey);
      }

      currentIdempotencyKey = storedKey;

      document.getElementById('payment-modal').style.display = 'flex';
      document.getElementById('payment-form').style.display = 'block';
      document.getElementById('payment-success').style.display = 'none';
      document.getElementById('card-errors').textContent = '';

      cardNumber.clear();
      cardExpiry.clear();
      cardCvc.clear();
      postalCode.clear();
    }

    function closePaymentModal() {
      document.getElementById('payment-modal').style.display = 'none';
    }

    async function handlePayment() {
      const submitBtn = document.getElementById('submit-payment');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing...';

      try {
        const res = await fetch('/create-payment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            invoiceId: currentInvoiceId,
            idempotencyKey: currentIdempotencyKey,
          }),
        });

        const { clientSecret, error } = await res.json();
        if (error) throw new Error(error);

        const { error: stripeError } = await stripe.confirmCardPayment(clientSecret, {
          payment_method: {
            card: cardNumber,
            billing_details: { name: 'Demo User' }
          },
        });

        if (stripeError) throw new Error(stripeError.message);

        sessionStorage.removeItem(`idempotency_key_${currentInvoiceId}`);

        document.getElementById('payment-form').style.display = 'none';
        document.getElementById('payment-success').style.display = 'block';

        setTimeout(() => {
          closePaymentModal();
          loadInvoices();
        }, 2000);

      } catch (err) {
        document.getElementById('card-errors').textContent = err.message;
        // alert('Payment failed: ' + err.message); // Keep this commented out as requested
        submitBtn.disabled = false;
        submitBtn.textContent = 'Pay Now';
      }
    }

    function openCreateModal() {
      document.getElementById('new-customer').value = '';
      document.getElementById('new-amount').value = '';
      document.getElementById('create-error').textContent = '';
      document.getElementById('create-modal').style.display = 'flex';
    }

    function closeCreateModal() {
      document.getElementById('create-modal').style.display = 'none';
    }

    async function handleCreateInvoice() {
      const customer = document.getElementById('new-customer').value.trim();
      const amountRaw = document.getElementById('new-amount').value;
      const amount = parseInt(amountRaw, 10);
      const errorDiv = document.getElementById('create-error');
      errorDiv.textContent = '';

      if (!customer) {
        errorDiv.textContent = 'Customer name is required';
        return;
      }
      if (!amountRaw || isNaN(amount) || amount <= 0) {
        errorDiv.textContent = 'Amount must be a positive number';
        return;
      }

      try {
        const res = await fetch('/invoices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer, amount }),
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        closeCreateModal();
        loadInvoices();
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    }

    document.getElementById('add-invoice-btn').onclick = openCreateModal;
    document.getElementById('submit-invoice').onclick = handleCreateInvoice;
    document.getElementById('cancel-invoice').onclick = closeCreateModal;

    document.getElementById('submit-payment').onclick = handlePayment;
    document.getElementById('cancel-payment').onclick = closePaymentModal;

    (async () => {
      await initStripe();
      await loadInvoices();
    })();
  </script>
</body>
</html>
